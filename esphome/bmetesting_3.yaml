# =============================================================================
# Medidor THR (temperatura / humedad) - Wemos D1 mini + BME280 + LCD 16x2
#                                       + capsula INA219 por el puerto del CAT6
# VERSION: 3  (2026-11-27)
# Archivo: c:\medidorTHR\esphome\bmetesting_3.yaml
#
# Cambios de la version 3 (sobre la 2), D-41 a D-44:
#   - Capsula del INA219 (GY-219, 0x40, shunt R100 en el lado alto) en el bus
#     de sensores, por el puerto I2C del CAT6 (GND / 3V3 / SDA / SCL).
#     Siempre declarado: si la capsula no esta conectada al arrancar, solo
#     falla ese sensor. ESPHome no lo vuelve a buscar hasta reiniciar
#     (conectar la capsula y dar clic largo).
#   - En Home Assistant: Voltaje, Corriente, Potencia, Voltaje shunt y
#     Energia (Wh); botones "Energia a cero" y "Reiniciar"; interruptor
#     "Modo banco".
#   - LCD, 2a fila: el INA (V y A) si responde; si no, filamentos (BME 0x77)
#     si responde; si no, la fecha y la hora.
#   - Boton (D7):
#       1 clic     = luz (30 s); con la luz encendida, la apaga. Responde
#                    ~0.4 s despues de soltar (espera por si es doble clic).
#       2 clics    = modo banco: luz fija y refresco de 1 s del INA y el LCD.
#                    Se conserva despues de reiniciar o desconectar.
#       clic largo = reinicio (dejarlo apretado 3 s).
#   - Refresco del INA y del LCD: cada 5 s (cada 1 s en modo banco).
#   - La energia se acumula desde el arranque (no se guarda en la flash).
#
# Pines (confirmados en la protoboard):
#   Bus sensores: SDA D1 (GPIO5), SCL D2 (GPIO4)  (placa soldada; la guia decia al reves)
#   Bus LCD:      SDA D6 (GPIO12), SCL D5 (GPIO14)
#   Boton:        D7 (GPIO13) a GND, pull-up interno
# Direcciones: 0x76 = BME ambiente, 0x77 = BME filamentos (sin uso por ahora),
#              0x40 = INA219 de la capsula, 0x27 = LCD.
# =============================================================================

substitutions:
  backlight_timeout: 30s          # tiempo que la luz queda encendida (fuera del modo banco)

esphome:
  name: bmetesting                # mismo nombre del dispositivo actual (OTA sin cambios)
  friendly_name: BMEtesting
  project:
    name: "carlos.medidor_thr"
    version: "3"                  # se ve en HA: Dispositivos > BMEtesting
  on_boot:
    priority: -100                # despues de que todo (incluido el LCD) inicio
    then:
      - switch.turn_on: sw_backlight

esp8266:
  board: d1_mini
  restore_from_flash: true        # el modo banco se conserva aunque se desconecte

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------- Hora (la toma de Home Assistant, con su zona horaria) ----------
time:
  - platform: homeassistant
    id: ha_time

# ---------- DOS buses I2C separados ----------
i2c:
  - id: bus_sensores
    sda: GPIO5         # D1  (asi esta soldada la placa: SDA y SCL invertidos respecto a la guia)
    scl: GPIO4         # D2
    scan: true         # el log lista las direcciones encontradas (esperado: 0x76 y 0x40 con la capsula)
  - id: bus_lcd
    sda: GPIO12        # D6
    scl: GPIO14        # D5
    scan: true         # esperado: 0x27

# ---------- Sensores (bus de 3.3V) ----------
sensor:
  - platform: bme280_i2c
    i2c_id: bus_sensores
    address: 0x76            # AMBIENTE: SDO->GND en la tira de bus
    temperature:
      name: "Temp Ambiente"
      id: temp_amb
    humidity:
      name: "Humedad Ambiente"
      id: hum_amb
    pressure:
      name: "Presion Ambiente"
    update_interval: 30s

  - platform: bme280_i2c
    i2c_id: bus_sensores
    address: 0x77            # FILAMENTOS (remoto por CAT6): declarado, probablemente sin uso
    temperature:
      name: "Temp Filamentos"
      id: temp_fil
    humidity:
      name: "Humedad Filamentos"
      id: hum_fil
    pressure:
      name: "Presion Filamentos"
    update_interval: 30s

  # INA219 de la capsula (GY-219): shunt R100 en el lado alto, 3.3-12 V y <= 1 A
  - platform: ina219
    i2c_id: bus_sensores
    id: ina
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 3.2A        # el maximo con R100 (D-44)
    max_voltage: 16V         # rango de 16 V del INA219: alcanza para 12 V con mejor resolucion
    bus_voltage:
      name: "Voltaje"
      id: ina_v
      accuracy_decimals: 2
    current:
      name: "Corriente"
      id: ina_i
      accuracy_decimals: 3
    power:
      name: "Potencia"
      id: ina_p
      accuracy_decimals: 3
    shunt_voltage:
      name: "Voltaje shunt"
      accuracy_decimals: 4
    update_interval: never   # lo actualiza el 'interval' de abajo (5 s, o 1 s en modo banco)

  - platform: integration
    name: "Energia"
    id: ina_e
    sensor: ina_p
    time_unit: h
    unit_of_measurement: Wh
    accuracy_decimals: 3
    integration_method: trapezoid
    restore: false           # empieza en 0 al arrancar (no gasta la flash)

# ---------- Refresco: INA y LCD cada 5 s, cada 1 s en modo banco ----------
interval:
  - interval: 1s
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick = (tick + 1) % 5;
          if (id(sw_banco).state || tick == 0) {
            if (!id(ina).is_failed()) id(ina).update();   // sin capsula al arrancar: no lo lee
            id(lcddisp).update();
          }

# ---------- LCD (bus de 5V) ----------
display:
  - platform: lcd_pcf8574
    i2c_id: bus_lcd
    id: lcddisp                 # id para poder controlar el backlight
    dimensions: 16x2
    address: 0x27
    update_interval: never      # lo actualiza el 'interval'
    lambda: |-
      // Fila 1: ambiente
      it.printf(0, 0, "Ambiente");
      it.printf(10, 0, "%2.0f %2.0f%%", id(temp_amb).state, id(hum_amb).state);
      // Fila 2: INA si responde; si no, filamentos; si no, fecha y hora
      if (!isnan(id(ina_v).state)) {
        // ej.: "12.05V  0.512A"
        it.printf(0, 1, "%5.2fV %6.3fA", id(ina_v).state, id(ina_i).state);
      } else if (!isnan(id(temp_fil).state)) {
        it.printf(0, 1, "Filamento");
        it.printf(10, 1, "%2.0f %2.0f%%", id(temp_fil).state, id(hum_fil).state);
      } else {
        auto t = id(ha_time).now();
        if (t.is_valid()) {
          static const char *dias[] = {"Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"};
          // ej.: "Lun 19/10  14:35"
          it.printf(0, 1, "%s %02d/%02d  %02d:%02d", dias[t.day_of_week - 1],
                    t.day_of_month, t.month, t.hour, t.minute);
        } else {
          it.printf(0, 1, "Sin hora (HA)");
        }
      }

# ---------- Backlight y modo banco ----------
switch:
  - platform: template
    name: "Luz LCD"
    id: sw_backlight
    optimistic: true
    restore_mode: ALWAYS_OFF            # no recuerda estado; on_boot la enciende
    turn_on_action:
      - lambda: 'id(lcddisp).backlight();'
      - if:                             # fuera del modo banco, se apaga sola
          condition:
            switch.is_off: sw_banco
          then:
            - script.execute: apagar_luz   # arranca (o reinicia) la cuenta regresiva
    turn_off_action:
      - script.stop: apagar_luz
      - lambda: 'id(lcddisp).no_backlight();'

  - platform: template
    name: "Modo banco"
    id: sw_banco
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # se conserva despues de reiniciar
    turn_on_action:
      - script.stop: apagar_luz
      - switch.turn_on: sw_backlight    # luz fija
    turn_off_action:
      - script.execute: apagar_luz      # la luz vuelve a apagarse sola

script:
  - id: apagar_luz
    mode: restart                       # si se vuelve a encender, la cuenta empieza de cero
    then:
      - delay: ${backlight_timeout}
      - switch.turn_off: sw_backlight

# ---------- Botones en Home Assistant ----------
button:
  - platform: restart
    name: "Reiniciar"
    id: btn_reiniciar
  - platform: template
    name: "Energia a cero"
    on_press:
      - sensor.integration.reset: ina_e

# ---------- Boton fisico (pulsador entre D7 y GND) ----------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13             # D7
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Boton Luz LCD"        # mismo nombre que en la v2 (no deja entidades huerfanas en HA)
    on_multi_click:
      - timing:                  # clic largo: reinicio
          - ON for at least 3s
        then:
          - button.press: btn_reiniciar
      - timing:                  # 2 clics: modo banco
          - ON for at most 0.6s
          - OFF for at most 0.4s
          - ON for at most 0.6s
          - OFF for at least 0.2s
        then:
          - switch.toggle: sw_banco
      - timing:                  # 1 clic: luz
          - ON for at most 1s
          - OFF for at least 0.4s
        then:
          - switch.toggle: sw_backlight
